name: Release

# Manual only, by design: publishing spends the maintainer's npm identity
# and touches NPM_TOKEN. There is deliberately NO push/tag trigger — pushing
# a tag alone publishes NOTHING. An operator must open Actions > Release >
# Run workflow and tick the boxes below.
#
# Operator flow:
#   1. npm version patch|minor|major   # bumps package.json + lock
#   2. git push --follow-tags          # tag alone publishes nothing
#   3. Actions > Release > Run workflow, version = the tag you pushed.
#      Leave publish_npm unticked for a dry GitHub-only release first;
#      re-run with publish_npm ticked to ship npmjs.org.
# Required repo setup (once): Settings > Environments > create `release`
# and `npm-publish`, each with Required reviewers = maintainer(s), so even
# a misclicked manual run cannot spend the token without a second pair
# of eyes. NPM_TOKEN should be a granular publish-scoped token.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag/version to release (e.g. v0.2.1). Must match the tag you pushed.'
        required: true
        type: string
      create_github_release:
        description: 'Attach the dist tarball to a GitHub Release'
        required: false
        default: true
        type: boolean
      publish_npm:
        description: 'Publish to npmjs.org (spends NPM_TOKEN)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    needs: build
    if: inputs.create_github_release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Package dist
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json README.md LICENSE release/
          tar -czf codewhip-${{ inputs.version }}.tar.gz -C release .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: codewhip-${{ inputs.version }}.tar.gz
          tag_name: ${{ inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: build
    if: inputs.publish_npm
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm version "${VERSION#v}" --no-git-tag-version
        env:
          VERSION: ${{ inputs.version }}
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
