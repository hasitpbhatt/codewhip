name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Package dist
        run: |
          mkdir -p release
          cp -r dist release/
          cp package.json README.md LICENSE release/
          tar -czf codewhip-${GITHUB_REF_NAME}.tar.gz -C release .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: codewhip-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
