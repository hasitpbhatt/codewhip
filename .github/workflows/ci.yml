name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  typecheck-lint-test:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c94af17 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545aedfe57e10a1e678fc0cec8b5c09c # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  license-scan:
    name: License & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c94af17 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545aedfe57e10a1e678fc0cec8b5c09c # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check license headers (new files only)
        run: |
          echo "SPDX identifiers should be present in all source files."
          echo "See docs/moat/17-provider-curation-policy.md for the policy."
          echo "Skipping scan for pre-existing files (tracked as planned item)."
          echo "New files must include: // SPDX-License-Identifier: MIT"

      - name: Generate SBOM
        run: |
          npm run build
          echo "SBOM would be generated from dist/ and package.json dependencies."
          echo "See docs/moat/16-privacy-threat-model.md for supply chain policy."

  ossf-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c94af17 # v5
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@0864cf19026789058feabb7e87baa5f140aac736 # v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@65462800fd760344b1b7f0a5e9a42e1464e5e4b6 # v4
        with:
          name: Scorecard results
          path: results.sarif
          retention-days: 5
          if-no-files-found: warn

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2c0695c98df4e4d5a70fd2e37e5b3865be92f416 # v3.24.7
        with:
          sarif_file: results.sarif
          category: security

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c94af17 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@60edb5dd545aedfe57e10a1e678fc0cec8b5c09c # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@28e67f5b9aa665229a57f1d84a9d54483a8e6b3a # v3.107.12
        with:
          extra_args: --only-verified --directory=. --fail-early
