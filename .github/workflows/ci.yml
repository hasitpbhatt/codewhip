name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  typecheck-lint-test:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  license-scan:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check for leaked secrets
        run: |
          echo "Checking for accidental secret commits..."
          if git log --all --format='%H' | xargs -I{} git show {} 2>/dev/null | grep -qE '(sk-[a-zA-Z0-9]{20}|pk_[a-zA-Z0-9]{50}|sk_live_[a-zA-Z0-9]{24})'; then
            echo "Potential secret found in git history!"
            exit 1
          fi
          echo "No secrets found in git history."

      - name: Verify license
        run: |
          echo "All source files must include SPDX-License-Identifier: MIT"
          echo "See docs/moat/17-provider-curation-policy.md for policy."

  ossf-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scorecard results
          path: results.sarif
          retention-days: 5
          if-no-files-found: warn

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: security

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical || true
        continue-on-error: true

      - name: Check lockfile integrity
        run: |
          echo "Verifying package-lock.json matches package.json..."
          npm ci --prefer-offline 2>&1 || { echo "Lockfile mismatch!"; exit 1; }
          echo "Lockfile is consistent."
