name = "codewhip-proxy"
main = "src/index.ts"
compatibility_date = "2024-09-14"

[vars]
# Environment variables for the proxy
BEARER_TOKEN = ""  # Optional: set a bearer token for authentication
# CLOUDFLARE_ACCOUNT_ID = ""  # For Cloudflare Workers AI provider

[[kv_namespaces]]
binding = "PROXY_STORAGE"
id = "your-kv-namespace-id"
preview_id = "your-kv-namespace-preview-id"

[build]
command = "npm run build"
watch_dir = ["src", "../src/lib"]

[build.upload]
format = "modules"
main = "src/index.ts"

# Optional: Configure wrangler.toml for local development
# [miniflare]
# kv_namespaces = [{ binding = "PROXY_STORAGE", id = "proxy-storage" }]